<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Tracker NFC</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #f0f4f8; 
      text-align: center; 
      padding: 20px; 
      margin: 0; 
    }
    .card { 
      background: #ffffff; 
      padding: 30px 20px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      max-width: 400px; 
      margin: 20px auto; 
    }
    h2 { 
      color: #1a202c; 
      margin-top: 0;
      margin-bottom: 8px; 
    }
    p { 
      color: #718096; 
      font-size: 14px; 
      line-height: 1.5;
    }
    button { 
      background-color: #3182ce; 
      color: white; 
      border: none; 
      padding: 16px 24px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 10px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 15px; 
      box-shadow: 0 4px 12px rgba(49,130,206,0.3);
      transition: background-color 0.2s;
    }
    button:active { 
      background-color: #2b6cb0; 
    }
    #statusBox { 
      margin-top: 25px; 
      padding: 18px; 
      border-radius: 12px; 
      background: #edf2f7; 
      font-size: 15px; 
      font-weight: 600; 
      color: #2d3748; 
      min-height: 80px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      white-space: pre-line;
      line-height: 1.6;
    }
    .keluar { 
      background-color: #fff5f5 !important; 
      color: #c53030 !important; 
      border: 2px solid #feb2b2; 
    }
    .masuk { 
      background-color: #f0fff4 !important; 
      color: #276749 !important; 
      border: 2px solid #9ae6b4; 
    }
    .error {
      background-color: #fffaf0 !important;
      color: #c05621 !important;
      border: 2px solid #fbd38d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📁 File Tracker NFC</h2>
    <p>Tekan butang di bawah dan sentuhkan kad Touch 'n Go pada belakang telefon anda.</p>
    
    <button onclick="mulaImbas()">Mula Imbas NFC</button>
    
    <div id="statusBox">Tekan "Mula Imbas NFC" untuk bermula.</div>
  </div>

  <script>
    // === MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI ===
    const GAS_URL = "https://script.google.com/macros/s/GANTIKAN_DENGAN_URL_DEPLOYMENT_ANDA/exec";

    async function mulaImbas() {
      const box = document.getElementById('statusBox');

      // Semak sokongan Web NFC
      if (!('NDEFReader' in window)) {
        box.className = 'error';
        box.innerText = "Pelayar ini tidak menyokong Web NFC.\nSila guna Google Chrome pada Android.";
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        box.className = '';
        box.innerText = "Sedia!\nSentuhkan kad Touch 'n Go pada belakang telefon...";

        ndef.addEventListener("reading", async ({ serialNumber }) => {
          if (!serialNumber) {
            box.className = 'error';
            box.innerText = "Kad dikesan tetapi UID tidak dapat dibaca.";
            return;
          }

          box.className = '';
          box.innerText = "UID: " + serialNumber + "\nMemproses data ke pangkalan data...";

          try {
            // Hantar UID ke Google Apps Script
            const response = await fetch(GAS_URL + "?uid=" + encodeURIComponent(serialNumber));
            const data = await response.json();

            if (data.error) {
              box.className = 'error';
              box.innerText = "Ralat: " + data.error;
              return;
            }

            // Paparkan hasil mengikut status pergerakan fail
            if (data.status === "KELUAR") {
              box.className = "keluar";
              box.innerText = "🔴 FAIL KELUAR\n\nFail: " + data.namaFail + "\nMasa: " + data.masa;
            } else {
              box.className = "masuk";
              box.innerText = "🟢 FAIL MASUK\n\nFail: " + data.namaFail + "\nMasa: " + data.masa;
            }

          } catch (err) {
            box.className = 'error';
            box.innerText = "Ralat Sambungan: " + err.message;
          }
        });

      } catch (err) {
        box.className = 'error';
        box.innerText = "Ralat NFC: " + err.message;
      }
    }
  </script>
</body>
</html>
